services:
  postgres-test:
    image: postgres:16-alpine
    container_name: shelflogr-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shelflogr_test
    ports:
      - '5433:5432'
    volumes:
      - ./api/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
